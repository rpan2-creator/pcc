name: Fetch photos
on:
  push:
    paths: ['scripts/fetch-photos.mjs', 'src/data/photos.js', '.github/workflows/photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-photos.mjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/photos src/data/photo-map.json
          git commit -m "Add self-hosted photos" || echo "nothing to commit"
          git push
